<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pet Assistant</title>
    <link rel="stylesheet" href="ai_chat.css">
</head>

<body>

        <a href="dashboard.html" class="back-btn">⬅ Back</a>

    </div>
