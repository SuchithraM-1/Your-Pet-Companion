<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – Pet Companion</title>
    <link rel="stylesheet" href="admin_login.css" />
</head>
<body>

    <div class="admin-container">
        <div class="admin-box">

            <h2 class="admin-title">Admin Login</h2>

            <label>Email</label>
            <input type="email" id="adminEmail" placeholder="Enter admin email">

            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter admin password">

            <button id="adminLoginBtn" class="btn">Login</button>

            <p class="note">Access restricted to authorized admins only.</p>
        </div>
    </div>

    <script src="admin_login.js"></script>
</body>
</html>
