<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Schedule – Pet Companion</title>
    <link rel="stylesheet" href="feeding.css">
</head>

<body>

<header class="header">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <h2 class="header-title">Feeding Schedule 🍽️</h2>
</header>

<div class="page">

    <section class="section">
        <h1>Your Pet Feeding Guide</h1>
        <p>Routine feeding ensures proper digestion & energy levels.</p>
    </section>

    <section class="card">
        <h2>Puppies / Kittens</h2>
        <p>3–4 times/day</p>
    </section>

    <section class="card">
        <h2>Adult Dogs</h2>
        <p>2 meals/day</p>
    </section>

    <section class="card">
        <h2>Adult Cats</h2>
        <p>2–3 small meals/day</p>
    </section>

    <section class="suggest-box">
        <h2>Have a suggestion? 📝</h2>
        <textarea id="suggestInput"></textarea>
        <button class="suggest-btn" onclick="submitSuggestion('feeding')">Submit</button>
        <p id="suggestMessage"></p>
    </section>

</div>

<script type="module" src="suggestions.js"></script>
</body>
</html>
